<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Border Test - Task 16.9</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'navy-950': '#0f1419',
            'navy-900': '#1a2332',
            'navy-800': '#1f2937',
            'navy-700': '#374151',
            'blue-accent': '#3b82f6',
            'blue-accent-hover': '#2563eb',
            'text-primary': '#f3f4f6',
            'text-secondary': '#9ca3af',
            'text-muted': '#6b7280',
          }
        }
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-navy-900">
  <div class="flex flex-col h-screen">
    <!-- Header with bottom border -->
    <header class="border-b border-navy-700 bg-gray-900/80 backdrop-blur-sm px-4 lg:px-6 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button class="p-2 text-gray-400 hover:text-gray-200 hover:bg-gray-800 rounded-lg transition-all duration-200">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
          <h1 class="text-xl lg:text-2xl font-bold text-gray-100">AI BRAIN</h1>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-xs font-semibold text-gray-300">6/75</span>
          <div class="w-9 h-9 rounded-full bg-blue-accent flex items-center justify-center text-white font-bold">
            U
          </div>
        </div>
      </div>
    </header>

    <!-- Chat area -->
    <div class="flex-1 overflow-y-auto p-4">
      <div class="max-w-3xl mx-auto space-y-4">
        <!-- Sample message -->
        <div class="flex justify-start">
          <div class="bg-navy-800/60 backdrop-blur-md rounded-2xl px-5 py-4 max-w-[80%]">
            <div class="flex items-center gap-2 mb-2">
              <span class="text-xs font-semibold text-text-secondary opacity-70">Assistant</span>
              <span class="text-xs text-text-secondary opacity-70">12:34 PM</span>
            </div>
            <p class="text-text-primary">Hello! How can I help you today?</p>
          </div>
        </div>

        <!-- Sample user message -->
        <div class="flex justify-end">
          <div class="bg-blue-accent/20 backdrop-blur-md rounded-2xl px-5 py-4 max-w-[80%]">
            <div class="flex items-center gap-2 mb-2">
              <span class="text-xs font-semibold text-text-secondary opacity-70">You</span>
              <span class="text-xs text-text-secondary opacity-70">12:35 PM</span>
            </div>
            <p class="text-text-primary">I need help with borders!</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Input area with top border -->
    <form class="p-6 w-full border-t border-navy-700">
      <div class="max-w-3xl mx-auto flex items-center gap-3">
        <!-- Attach button -->
        <button type="button" class="w-11 h-11 text-text-secondary hover:text-blue-accent rounded-full hover:bg-navy-800/60 transition-all duration-200 flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
          </svg>
        </button>

        <!-- Input field -->
        <div class="flex-1">
          <input 
            type="text" 
            placeholder="Type a message..." 
            class="w-full px-8 py-3 rounded-3xl bg-navy-800/60 backdrop-blur-md border border-navy-700 text-text-primary placeholder-text-secondary focus:outline-none focus:border-blue-accent transition-all duration-200"
          />
        </div>

        <!-- Send button -->
        <button type="submit" class="w-11 h-11 bg-blue-accent text-white rounded-full hover:bg-blue-accent-hover transition-all duration-200 flex items-center justify-center shadow-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
          </svg>
        </button>
      </div>
    </form>
  </div>

  <!-- Visual indicators -->
  <div class="fixed top-4 right-4 bg-navy-950 border border-navy-700 rounded-lg p-4 text-text-primary text-sm max-w-xs">
    <h3 class="font-bold mb-2">Border Test - Task 16.9</h3>
    <ul class="space-y-1 text-xs">
      <li>✓ Header bottom border: <span class="text-blue-accent">navy-700</span></li>
      <li>✓ Input top border: <span class="text-blue-accent">navy-700</span></li>
      <li>✓ Color: <span class="text-blue-accent">#374151</span></li>
    </ul>
    <div class="mt-3 pt-3 border-t border-navy-700">
      <p class="text-text-secondary text-xs">Borders create visual separation between header, chat area, and input.</p>
    </div>
  </div>
</body>
</html>
